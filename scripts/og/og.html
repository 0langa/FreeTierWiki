<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #0d0f11; color: #eceef0; font-family: "IBM Plex Sans", sans-serif; display: grid; grid-template-columns: 1fr 380px; gap: 56px; align-items: center; padding: 0 80px; box-sizing: border-box; }
  .mark { font: 600 30px "IBM Plex Mono", monospace; }
  .mark span { color: #34d399; }
  h1 { font-size: 76px; line-height: 1.02; margin: 28px 0 0; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: #34d399; }
  .label { border: 3px solid #eceef0; border-radius: 4px; padding: 18px 20px; background: #14171a; transform: rotate(1.5deg); }
  .label h2 { margin: 0; font-size: 34px; }
  .rule { height: 10px; background: #eceef0; margin: 12px 0; }
  .row { display: flex; justify-content: space-between; font-size: 22px; padding: 8px 0; border-top: 1px solid #262a30; color: #a8aeb6; }
  .row b { color: #eceef0; }
</style>
</head>
<body>
  <div>
    <div class="mark">freetier<span>.</span>wiki</div>
    <h1>Free tiers, with the <em>fine print.</em></h1>
  </div>
  <div class="label">
    <h2>Free tier facts</h2>
    <div class="rule"></div>
    <div class="row">Card required <b>No</b></div>
    <div class="row">Hard cap <b>Yes</b></div>
    <div class="row">Billing risk <b>None</b></div>
    <div class="row">Last checked <b>✓</b></div>
  </div>
</body>
</html>
