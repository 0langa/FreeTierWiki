name: Outdated or wrong info
description: Tell us when a free tier changed or an entry is wrong.
title: "Outdated: "
labels: ["content"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry URL
      description: The freetier.wiki page with the problem.
      placeholder: https://freetier.wiki/services/example/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: What does the page say, and what is true now?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the official pricing or docs page that shows the current terms.
      placeholder: https://example.com/pricing
