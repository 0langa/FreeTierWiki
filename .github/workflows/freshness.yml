name: Weekly pricing check

# Reads official pricing pages once a week (Sunday 19:23 UTC), fingerprints pricing text and table/icon markup, and opens an
# issue for changed, unreadable, noisy or still-unreviewed sources. The hashes live on the `freshness-data` branch.
# Entry dates change only after an entry review; this source scanner does not modify main.
# The page content is only parsed and hashed: it is never run, never sent to a model, and never put in the issue.
# The Sunday slot gives the Monday 08:00 UTC review routine (claude.ai) time to find the issue: GitHub has
# started this schedule up to eight hours late.

on:
  schedule:
    - cron: "23 19 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  check:
    name: Check pricing pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Load last week's hashes
        run: |
          mkdir -p data
          # Exit code 2 means the branch does not exist yet. Any other failure (network, auth) stops the run:
          # going on without last week's hashes would start a new baseline, miss a week of changes, and drop
          # the record of changes nobody has reviewed yet.
          found=0
          git ls-remote --exit-code --heads origin freshness-data >/dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            git fetch --depth=1 origin freshness-data
            git show FETCH_HEAD:source-hashes.json > data/source-hashes.json
          elif [ "$found" -eq 2 ]; then
            echo "No baseline yet: this run creates it."
          else
            echo "::error::Could not read the freshness-data branch (git ls-remote exit $found)."
            exit 1
          fi

      - name: Check pricing pages
        id: check
        run: node scripts/verify/check-freshness.mjs --hashes data/source-hashes.json --report freshness-report.md

      - name: Show the report in the job summary
        run: cat freshness-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the complete review queue
        uses: actions/upload-artifact@v4
        with:
          name: pricing-check
          path: |
            freshness-report.md
            freshness-review.json
          retention-days: 90

      - name: Open an issue when something needs a look
        if: github.ref == 'refs/heads/main' && steps.check.outputs.flagged != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FLAGGED: ${{ steps.check.outputs.flagged }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '\nFull queue: [download the pricing-check artifact](%s#artifacts).\n' "$RUN_URL" >> freshness-report.md
          gh label create freshness --description "Weekly pricing check" --color FBCA04 --force
          gh issue create --label freshness --title "Pricing check $(date -u +%F): $FLAGGED to look at" --body-file freshness-report.md

      - name: Save this week's hashes
        if: github.ref == 'refs/heads/main'
        run: |
          cp data/source-hashes.json "$RUNNER_TEMP/source-hashes.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          found=0
          git ls-remote --exit-code --heads origin freshness-data >/dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            git fetch --depth=1 origin freshness-data
            git switch --force -C freshness-data FETCH_HEAD
          elif [ "$found" -eq 2 ]; then
            git switch --orphan freshness-data
          else
            echo "::error::Could not read the freshness-data branch (git ls-remote exit $found)."
            exit 1
          fi
          cp "$RUNNER_TEMP/source-hashes.json" source-hashes.json
          git add source-hashes.json
          if ! git diff --cached --quiet; then
            git commit -m "pricing hashes $(date -u +%F)"
          fi
          git push origin freshness-data
