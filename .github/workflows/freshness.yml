name: Weekly pricing check

# Reads every official pricing page once a week (Sunday 19:23 UTC), hashes the price-related text, and opens an
# issue when the text changed or the page is gone. The hashes live on the `freshness-data` branch. The only
# change this job makes to `main` is the weekly lastVerified refresh for entries whose text did not change.
# The page text is only hashed: it is never run, never sent to a model, and never put in the issue.
# The Sunday slot gives the Monday 08:00 UTC review routine (claude.ai) time to find the issue: GitHub has
# started this schedule up to eight hours late.

on:
  schedule:
    - cron: "23 19 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  check:
    name: Check pricing pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the refresh commit below is rebased onto whatever landed on main during the run.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Load last week's hashes
        run: |
          mkdir -p data
          # Exit code 2 means the branch does not exist yet. Any other failure (network, auth) stops the run:
          # going on without last week's hashes would start a new baseline, miss a week of changes, and drop
          # the record of changes nobody has reviewed yet.
          found=0
          git ls-remote --exit-code --heads origin freshness-data >/dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            git fetch --depth=1 origin freshness-data
            git show FETCH_HEAD:source-hashes.json > data/source-hashes.json
          elif [ "$found" -eq 2 ]; then
            echo "No baseline yet: this run creates it."
          else
            echo "::error::Could not read the freshness-data branch (git ls-remote exit $found)."
            exit 1
          fi

      - name: Check pricing pages
        id: check
        run: node scripts/verify/check-freshness.mjs --hashes data/source-hashes.json --report freshness-report.md --mark-verified

      - name: Show the report in the job summary
        run: cat freshness-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when something needs a look
        if: steps.check.outputs.flagged != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FLAGGED: ${{ steps.check.outputs.flagged }}
        run: |
          gh label create freshness --description "Weekly pricing check" --color FBCA04 --force
          gh issue create --label freshness --title "Pricing check $(date -u +%F): $FLAGGED to look at" --body-file freshness-report.md

      # Entries whose page text is unchanged since their last review get lastVerified set to today, so the
      # freshness label on the site moves every week. A date-only change, checked by the unit tests, pushed
      # straight to main (a push with the workflow token starts no other workflow; Cloudflare still deploys).
      - name: Record the confirmed entries on main
        if: steps.check.outputs.verified != '0'
        env:
          VERIFIED: ${{ steps.check.outputs.verified }}
        run: |
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "content: weekly check $(date -u +%F), $VERIFIED entries confirmed unchanged"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save this week's hashes
        run: |
          cp data/source-hashes.json "$RUNNER_TEMP/source-hashes.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin freshness-data >/dev/null 2>&1; then
            git fetch --depth=1 origin freshness-data
            git switch --force -C freshness-data FETCH_HEAD
          else
            git switch --orphan freshness-data
          fi
          cp "$RUNNER_TEMP/source-hashes.json" source-hashes.json
          git add source-hashes.json
          git commit -m "pricing hashes $(date -u +%F)" || echo "Nothing to commit"
          git push origin freshness-data
