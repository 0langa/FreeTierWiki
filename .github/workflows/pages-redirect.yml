name: Redirect legacy GitHub Pages links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-redirect.yml
      - deployment/github-pages/**
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: pages-redirect
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare redirect pages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages-redirect"
          cp deployment/github-pages/index.html "$RUNNER_TEMP/pages-redirect/index.html"
          cp deployment/github-pages/index.html "$RUNNER_TEMP/pages-redirect/404.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-redirect
      - name: Deploy redirect
        id: deployment
        uses: actions/deploy-pages@v4
